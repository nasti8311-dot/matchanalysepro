<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tipps – MatchAnalysePro</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#07111f;color:#fff}a{text-decoration:none;color:inherit}.topbar{background:#050b14;border-bottom:1px solid #1d2b3d}.nav{max-width:1180px;margin:auto;padding:16px 22px;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:800;color:#24d366}.nav a{margin-left:22px;color:#d9e4f0;font-weight:600}.section{max-width:1000px;margin:auto;padding:50px 22px}.card{background:#0d1a2b;border:1px solid #20334d;border-radius:20px;padding:24px;margin-bottom:20px}.crest{width:34px;height:34px;object-fit:contain;border-radius:50%;background:#fff;padding:4px}.crest-fallback{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#24d366,#0d8bff);color:#03101c;font-size:15px;font-weight:1000}.teamline{display:inline-flex;align-items:center;gap:9px}.pick{background:#182e49;border-left:4px solid #24d366;padding:14px;border-radius:12px;margin-top:12px;font-weight:800}.muted{color:#9fb0c3}.footer{background:#050b14;text-align:center;padding:28px;color:#8fa2b8}@media(max-width:800px){.nav{display:block}.nav a{display:inline-block;margin:12px 14px 0 0}}</style></head><body><div class="topbar"><div class="nav"><div class="logo">⚽ MatchAnalysePro</div><div><a href="index.html">Home</a><a href="tipps.html">Tipps</a><a href="analyse.html">Analysen</a><a href="blog.html">News</a></div></div></div><main class="section"><h1>🔥 Tipps des Tages</h1><div id="tips"></div></main><div class="footer">© 2026 MatchAnalysePro</div><script src="spiele.js"></script><script>const tips=document.getElementById('tips');games.forEach(g=>{tips.innerHTML+=`<a class="card" href="analyse.html?spiel=${g.id}"><h2>${teamLine(g.heimWappen,g.heim)} vs ${teamLine(g.gastWappen,g.gast)}</h2><p class="muted">${g.liga} · ${g.zeit}</p><div class="pick">Tipp: ${g.tipp}</div><div class="pick">Confidence: ${g.confidence}/10 · Risiko: ${g.risikoLevel}</div><div class="pick">KI-Score: ${getScoreTip(g)} · ${getStars(g.confidence)}</div><p>🤖 ${getAiText(g)}</p><p>${g.fazit}</p></a>`});</script></body></html>
