<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Analyse – MatchAnalysePro</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#07111f;color:#fff}a{text-decoration:none;color:inherit}.topbar{background:#050b14;border-bottom:1px solid #1d2b3d}.nav{max-width:1180px;margin:auto;padding:16px 22px;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:800;color:#24d366}.nav a{margin-left:22px;color:#d9e4f0;font-weight:600}.hero{background:radial-gradient(circle at top,#16375f,#07111f 60%);padding:55px 22px}.wrap{max-width:1180px;margin:auto}.badge{display:inline-block;background:#132a43;color:#24d366;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.muted{color:#9fb0c3}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.card{background:#0d1a2b;border:1px solid #20334d;border-radius:22px;padding:24px;margin-bottom:22px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;text-align:center}.team{background:#101f33;border:1px solid #263b59;border-radius:18px;padding:20px}.crest{width:42px;height:42px;object-fit:contain;border-radius:50%;background:#fff;padding:5px}.crest-fallback{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#24d366,#0d8bff);color:#03101c;font-size:16px;font-weight:1000}.teamline{display:inline-flex;align-items:center;gap:9px}.vs{font-size:24px;font-weight:900;color:#24d366}.form{font-size:26px;letter-spacing:4px}.bar-row{margin:18px 0}.bar-label{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:800}.bar-bg{background:#101f33;border-radius:999px;overflow:hidden;border:1px solid #263b59}.bar{height:16px;background:#24d366;border-radius:999px}.bar.x{background:#f5b942}.bar.away{background:#ff3157}.stats,.h2h{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,.h2h div{background:#101f33;border:1px solid #263b59;border-radius:16px;padding:16px;text-align:center}.stat strong{display:block;color:#24d366;font-size:28px}.value{background:linear-gradient(135deg,#24d366,#0ea85a);color:#04120a;border-radius:20px;padding:22px;font-weight:900}.risk{background:#2b1b24;border:1px solid #ff3157;color:#ffd8df;border-radius:18px;padding:18px}.summary{background:#182e49;border-left:5px solid #24d366;border-radius:16px;padding:20px}.tablewrap{overflow:auto;border-radius:18px;border:1px solid #20334d}table{width:100%;border-collapse:collapse;background:#0d1a2b;min-width:620px}th,td{padding:14px;border-bottom:1px solid #20334d;text-align:left}th{color:#24d366;background:#101f33}.highlight-row{background:rgba(36,211,102,.09)}.footer{background:#050b14;text-align:center;padding:28px;color:#8fa2b8}@media(max-width:900px){.grid,.teams{grid-template-columns:1fr}.nav{display:block}.nav a{display:inline-block;margin:12px 14px 0 0}.stats,.h2h{grid-template-columns:1fr}}</style></head><body><div class="topbar"><div class="nav"><div class="logo">⚽ MatchAnalysePro</div><div><a href="index.html">Home</a><a href="tipps.html">Tipps</a><a href="analyse.html">Analysen</a><a href="blog.html">News</a></div></div></div><div id="page"></div><div class="footer">© 2026 MatchAnalysePro</div><script src="spiele.js"></script><script>const params=new URLSearchParams(location.search);const id=params.get('spiel')||games[0].id;const g=games.find(x=>x.id===id)||games[0];const leagueTable=tables[g.liga]||[];document.getElementById('page').innerHTML=`<section class="hero"><div class="wrap"><span class="badge">${g.liga} · ${g.zeit}</span><h1>${teamLine(g.heimWappen,g.heim)} vs ${teamLine(g.gastWappen,g.gast)}</h1><p class="muted">Datenbasierte Vorschau · KI-Score: <b>${getScoreTip(g)}</b> · Confidence: <b>${g.confidence}/10</b></p></div></section><main class="wrap" style="padding:34px 22px"><div class="card teams"><div class="team"><span class="badge">Heimteam</span><h2>${crest(g.heimWappen)}<br>${g.heim}</h2><div class="form">${g.formHeim}</div></div><div class="vs">VS</div><div class="team"><span class="badge">Auswärtsteam</span><h2>${crest(g.gastWappen)}<br>${g.gast}</h2><div class="form">${g.formGast}</div></div></div><div class="grid"><section><div class="card"><h2>📈 Siegwahrscheinlichkeiten</h2><div class="bar-row"><div class="bar-label"><span>${g.heim}</span><span>${g.wahrscheinlichkeit.heim}%</span></div><div class="bar-bg"><div class="bar" style="width:${g.wahrscheinlichkeit.heim}%"></div></div></div><div class="bar-row"><div class="bar-label"><span>Unentschieden</span><span>${g.wahrscheinlichkeit.remis}%</span></div><div class="bar-bg"><div class="bar x" style="width:${g.wahrscheinlichkeit.remis}%"></div></div></div><div class="bar-row"><div class="bar-label"><span>${g.gast}</span><span>${g.wahrscheinlichkeit.gast}%</span></div><div class="bar-bg"><div class="bar away" style="width:${g.wahrscheinlichkeit.gast}%"></div></div></div></div><div class="card"><h2>⚽ Tortrends</h2><div class="stats"><div class="stat">Over 2,5<strong>${g.tore.over25}%</strong></div><div class="stat">BTTS<strong>${g.tore.btts}%</strong></div><div class="stat">Under 3,5<strong>${g.tore.under35}%</strong></div></div></div><div class="card"><h2>⭐ Spieler im Fokus</h2><p>${g.topPlayers.map(p=>`<span class="badge">${p}</span>`).join(' ')}</p></div><div class="card"><h2>🤝 H2H</h2><div class="h2h"><div><strong>${g.h2h.heim}</strong><br>${g.heim}</div><div><strong>${g.h2h.remis}</strong><br>Remis</div><div><strong>${g.h2h.gast}</strong><br>${g.gast}</div></div></div><div class="card"><h2>📊 Tabelle: ${g.liga}</h2><div class="tablewrap"><table><thead><tr><th>Pl.</th><th>Team</th><th>Spiele</th><th>Punkte</th><th>Tordiff.</th></tr></thead><tbody>${leagueTable.map(t=>`<tr class="${t.team===g.heim||t.team===g.gast?'highlight-row':''}"><td>${t.pos}</td><td>${teamLine(t.wappen,t.team)}</td><td>${t.spiele}</td><td>${t.punkte}</td><td>${t.tore}</td></tr>`).join('')}</tbody></table></div></div></section><aside><div class="value">✅ Confidence Score: ${g.confidence}/10<br>⭐ Bewertung: ${getStars(g.confidence)}<br>🛡️ Risiko-Level: ${g.risikoLevel}<br><br>🤖 KI-Score-Tipp: ${getScoreTip(g)}<br><br>🔥 ${g.value}<br><br>${getAiText(g)}</div><br><div class="risk">⚠️ Risiko: ${g.risiko}</div><br><div class="card summary"><h2>🧠 Kurz gesagt</h2><p><b>Tipp:</b> ${g.tipp}</p><p>${g.fazit}</p></div></aside></div></main>`;</script></body></html>
